name: Apply Dashboard Telemetry Fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-dashboard-telemetry-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-test-8ch-v2.0.1
          fetch-depth: 1

      - name: Apply existing telemetry patch
        run: python3 tools/fix_dashboard_telemetry.py

      - name: Apply final UI compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino")
          s = path.read_text(encoding="utf-8")

          patch = r'''
          <style>
          /* Final hardware-test UI compatibility fixes */
          button.btn-emergency,
          button.btn-emergency:disabled {
            opacity: 1 !important;
            filter: none !important;
            color: #d92f3d !important;
            background: #fff5f5 !important;
            border: 1px solid #f23845 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
          }
          button.btn-resume,
          button.btn-resume:disabled {
            opacity: 1 !important;
            filter: none !important;
            color: #fff !important;
            background: #0b9f53 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
          }
          </style>
          <script>
          function loadPowerSettings() {
            if (!window.DATA || !Array.isArray(DATA.relays)) return;

            const inputs = Array.from(document.querySelectorAll('input'));
            const wattInputs = inputs.filter(el =>
              /watt/i.test(el.id || '') || /watt/i.test(el.name || '')
            );

            DATA.relays.forEach((relay, index) => {
              let input = wattInputs[index];

              if (!input) {
                const labels = Array.from(document.querySelectorAll('label'));
                const label = labels.find(l =>
                  l.textContent.trim().startsWith(`Relay ${index + 1} Wattage`)
                );
                if (label) {
                  const id = label.getAttribute('for');
                  if (id) input = document.getElementById(id);
                }
              }

              if (input && document.activeElement !== input) {
                input.value = Number(relay.wattage || 0);
              }
            });

            const tariffInputs = inputs.filter(el =>
              /tariff/i.test(el.id || '') || /tariff/i.test(el.name || '')
            );
            if (tariffInputs[0] && document.activeElement !== tariffInputs[0]) {
              tariffInputs[0].value = Number(DATA.tariff || 0);
            }
          }

          function forceHardwareTestUI() {
            if (!window.DATA) return;

            const connected = DATA.apiConnected !== false;
            const connection = document.getElementById('connection');
            const footer = document.getElementById('footerConnection');
            const status = document.getElementById('systemStatus');

            if (connection) connection.textContent = connected ? 'Connected' : 'Disconnected';
            if (footer) {
              footer.textContent = 'ESP32 ' +
                (connected ? 'Connected' : 'Disconnected') + ' | ' + (DATA.ip || '');
            }

            document.querySelectorAll('button.btn-emergency, button.btn-resume').forEach(btn => {
              btn.disabled = false;
              btn.removeAttribute('disabled');
            });

            if (connected && status && !status.textContent.includes('Emergency OFF')) {
              status.innerHTML = "<b style='color:#08b95c'>● ESP32 connected</b><br>API connection active • 4 devices configured • Schedules available";
            }

            loadPowerSettings();
          }

          setInterval(forceHardwareTestUI, 1000);
          </script>
          '''

          # Insert the compatibility layer immediately before the final script tag.
          marker = '</script>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('Could not find final </script> marker')

          # Avoid duplicate insertion if the workflow is manually rerun.
          if 'Final hardware-test UI compatibility fixes' not in s:
              s = s[:pos] + patch + '\n' + s[pos:]

          path.write_text(s, encoding='utf-8')
          print('Final UI compatibility patch applied')
          PY

      - name: Validate patched firmware
        run: |
          grep -q 'Final hardware-test UI compatibility fixes' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          grep -q 'function loadPowerSettings()' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          grep -q 'button.btn-emergency' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          grep -q 'DATA.apiConnected' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          grep -A5 'const uint8_t relayPins' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino | grep -q '19,'
          grep -A5 'const uint8_t relayPins' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino | grep -q '18,'
          grep -A5 'const uint8_t relayPins' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino | grep -q '5,'
          grep -A5 'const uint8_t relayPins' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino | grep -q '17'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino .github/workflows/apply-dashboard-telemetry-fix.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "fix: finalize hardware test connection power and emergency UI"
            git push origin HEAD:feature/hardware-test-8ch-v2.0.1
          fi
