name: Apply Dashboard Telemetry Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-test-8ch-v2.0.1
          fetch-depth: 1
      - name: Apply patch
        run: python3 tools/fix_dashboard_telemetry.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino tools/fix_dashboard_telemetry.py .github/workflows/apply-dashboard-telemetry-fix.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "fix: dashboard telemetry and emergency UI"
            git push origin HEAD:feature/hardware-test-8ch-v2.0.1
          fi
