name: Fix Dashboard Telemetry

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-dashboard-telemetry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch final hardware-test firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: feature/hardware-test-8ch-v2.0.1
          FILE: firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          path = os.environ['FILE']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}'

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('X-GitHub-Api-Version', '2026-03-10')
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          obj = request(api)
          sha = obj['sha']
          text = base64.b64decode(obj['content']).decode('utf-8')
          original = text

          def replace_once(old, new, label, required=False):
              global text
              if old in text:
                  text = text.replace(old, new, 1)
                  print('patched:', label)
                  return True
              print('already patched or pattern absent:', label)
              if required:
                  raise SystemExit('required pattern missing: ' + label)
              return False

          # Keep v2.0.1 as a 4-relay firmware, but map those four logical
          # relays to the first four outputs of the user's 8-way board.
          replace_once(
              '''const uint8_t relayPins[RELAY_COUNT] = {\n  5,\n  17,\n  16,\n  4\n};''',
              '''const uint8_t relayPins[RELAY_COUNT] = {\n  19,\n  18,\n  5,\n  17\n};''',
              '8-way board GPIO mapping'
          )

          # Expose tariff and wattage through /api/status.
          replace_once(
              '  json += "\\\"wifi\\\":" + String(WiFi.status() == WL_CONNECTED ? "true" : "false") + ",";\n  json += "\\\"relays\\\":[";',
              '  json += "\\\"wifi\\\":" + String(WiFi.status() == WL_CONNECTED ? "true" : "false") + ",";\n  json += "\\\"tariff\\\":" + String(electricityTariff, 2) + ",";\n  json += "\\\"relays\\\":[";',
              'status tariff'
          )
          replace_once(
              '    json += "\\\"runtime\\\":" + String(getCurrentRuntime(i)) + ",";\n    json += "\\\"schedules\\\":[";',
              '    json += "\\\"runtime\\\":" + String(getCurrentRuntime(i)) + ",";\n    json += "\\\"wattage\\\":" + String(r.wattage, 2) + ",";\n    json += "\\\"schedules\\\":[";',
              'status wattage'
          )

          # Treat successful /api/status as connected and restore saved power settings.
          replace_once(
              '''  .then(data => {\n\n    DATA = data;\n\n    render();\n\n  })''',
              '''  .then(data => {\n\n    DATA = data;\n    DATA.connected = true;\n\n    render();\n    loadPowerSettings();\n\n  })''',
              'status success connection'
          )
          replace_once(
              '''  $("connection").textContent =\n    DATA.wifi\n      ? "Connected"\n      : "Disconnected";''',
              '''  $("connection").textContent =\n    DATA.connected\n      ? "Connected"\n      : "Disconnected";''',
              'header connection'
          )
          replace_once(
              '''  $("footerConnection").textContent =\n    "ESP32 " +\n    (DATA.wifi ? "Connected" : "Disconnected") +\n    " | " +\n    DATA.ip;''',
              '''  $("footerConnection").textContent =\n    "ESP32 " +\n    (DATA.connected ? "Connected" : "Disconnected") +\n    " | " +\n    DATA.ip;''',
              'footer connection'
          )
          replace_once(
              '''  $("systemStatus").innerHTML = DATA.wifi\n    ? (anyEmergency\n        ? "<b style='color:#f23845'>● Emergency OFF active</b><br>" +\n          "One or more relays are isolated from schedules. <button onclick=\\"resumeAll()\\">Resume AUTO</button>"\n        : "<b style='color:#08b95c'>● All systems normal</b><br>" +\n          "4 devices configured • Wi-Fi connected • Schedules active")\n    : "<b style='color:#f23845'>● Wi-Fi disconnected</b>";''',
              '''  $("systemStatus").innerHTML = DATA.connected\n    ? (anyEmergency\n        ? "<b style='color:#f23845'>● Emergency OFF active</b><br>" +\n          "One or more relays are isolated from schedules. <button onclick=\\"resumeAll()\\">Resume AUTO</button>"\n        : "<b style='color:#08b95c'>● ESP32 connected</b><br>" +\n          "4 devices configured • Dashboard online • Schedules active")\n    : "<b style='color:#f23845'>● ESP32 disconnected</b>";''',
              'system status'
          )
          replace_once(
              '''.btn-off {\n  background:#f23845;\n}''',
              '''.btn-off {\n  background:#f23845;\n}\n\n.btn-emergency {\n  background:#fff5f5;\n  color:#c92f3d;\n  border:1px solid #ff8a8a;\n  min-height:40px;\n  white-space:nowrap;\n  font-weight:700;\n}''',
              'emergency button style'
          )
          replace_once(
              '''${relay.emergency ? `<button class="btn btn-off" onclick="resumeRelay(${relay.id})">▶ Resume AUTO</button>` : `<button class="btn" style="border:1px solid #ff8a8a" onclick="emergencyOff(${relay.id})">🚨 Emergency OFF</button>`}''',
              '''${relay.emergency ? `<button class="btn btn-off btn-emergency" onclick="resumeRelay(${relay.id})">▶ Resume AUTO</button>` : `<button class="btn btn-emergency" onclick="emergencyOff(${relay.id})">🚨 Emergency OFF</button>`}''',
              'emergency button markup'
          )

          # Mark failed status requests disconnected.
          replace_once(
              '''  .catch(() => {\n\n    $("connection").textContent =\n      "Disconnected";''',
              '''  .catch(() => {\n\n    if (DATA) DATA.connected = false;\n\n    $("connection").textContent =\n      "Disconnected";''',
              'status failure connection'
          )

          if text == original:
              print('No source changes needed.')
              raise SystemExit(0)

          payload = {
              'message': 'fix: map v2.0.1 to 8-way board and finalize dashboard fixes',
              'content': base64.b64encode(text.encode()).decode(),
              'sha': sha,
              'branch': branch
          }
          result = request(f'https://api.github.com/repos/{repo}/contents/{path}', 'PUT', payload)
          print('Updated:', result['content']['path'])
          print('Commit:', result['commit']['sha'])
          PY
