name: Prepare 8ch Hardware Test Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: feature/hardware-test-8ch-v2.0.1
          fetch-depth: 0

      - name: Apply 8-channel board GPIO mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          old = '''const uint8_t relayPins[RELAY_COUNT] = {
            5,
            17,
            16,
            4
          };'''
          new = '''const uint8_t relayPins[RELAY_COUNT] = {
            19,
            18,
            5,
            17
          };'''
          if old not in s:
              raise SystemExit('Expected v2.0.1 GPIO block was not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify source is complete and has no conflict markers
        shell: bash
        run: |
          test -s firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          grep -n 'ArduinoOTA.h' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          grep -n -A5 'relayPins\[RELAY_COUNT\]' firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino

      - name: Commit GPIO mapping
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino
          git commit -m 'test: map v2.0.1 to 8ch relay hardware'
          git push origin HEAD:feature/hardware-test-8ch-v2.0.1
