name: Prepare 8ch Hardware Test Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hardware-test-8ch-v2.0.1

permissions:
  contents: write

env:
  TEST_BRANCH: feature/hardware-test-8ch-v2.0.1

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "${GITHUB_REPOSITORY}" repo -- --branch "$TEST_BRANCH" --single-branch
          cd repo
          git fetch --depth 1 origin tag v2.0.1

      - name: Restore clean v2.0.1 source
        run: |
          cd repo
          rm -rf /tmp/ESP32_Smart_Relay_Controller
          mkdir -p /tmp/ESP32_Smart_Relay_Controller
          git show v2.0.1:firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino > /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino

      - name: Apply 8-channel hardware GPIO mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          old = '''const uint8_t relayPins[RELAY_COUNT] = {\n  5,\n  17,\n  16,\n  4\n};'''
          new = '''const uint8_t relayPins[RELAY_COUNT] = {\n  19,\n  18,\n  5,\n  17\n};'''
          if old not in s:
              raise SystemExit('Expected v2.0.1 relay GPIO block was not found; refusing to build.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply dashboard summary fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          old = '''function render() {\n\n  if (!DATA) return;\n\n\n  $("connection").textContent ='''
          new = '''function render() {\n\n  if (!DATA) return;\n\n  // Update dashboard summary cards from the live relay status.\n  // Runtime values are milliseconds; wattage values are watts.\n  const activeRelays = DATA.relays.filter(r => r.state).length;\n  let totalRuntime = 0;\n  let currentPower = 0;\n  let totalEnergyWh = 0;\n\n  DATA.relays.forEach(relay => {\n    const runtime = Number(relay.runtime || 0);\n    const watts = Number(relay.wattage || 0);\n\n    totalRuntime += runtime;\n    if (relay.state) currentPower += watts;\n    totalEnergyWh += (runtime / 3600000) * watts;\n  });\n\n  $("summaryActive").textContent =\n    activeRelays + " / " + DATA.relays.length;\n\n  $("summaryActiveDetail").textContent =\n    activeRelays === 0\n      ? "All relays OFF"\n      : activeRelays + " relay" + (activeRelays === 1 ? "" : "s") + " ON";\n\n  $("summaryRuntime").textContent =\n    formatRuntime(totalRuntime);\n\n  $("summaryRuntimeDetail").textContent =\n    "Across all relays";\n\n  $("summaryPower").textContent =\n    currentPower.toFixed(1).replace(/\\.0$/, "") + " W";\n\n  $("summaryEnergy").textContent =\n    totalEnergyWh.toFixed(2) + " Wh today";\n\n  const nextSchedule = getNextSchedule();\n\n  if (nextSchedule) {\n    $("summaryNext").textContent =\n      nextSchedule.date.toLocaleTimeString([], {\n        hour: "2-digit",\n        minute: "2-digit",\n        hour12: true\n      });\n\n    $("summaryNextDetail").textContent =\n      nextSchedule.relay.name;\n  } else {\n    $("summaryNext").textContent = "None";\n    $("summaryNextDetail").textContent = "No upcoming schedule";\n  }\n\n\n  $("connection").textContent ='''
          if old not in s:
              raise SystemExit('Expected render() block was not found; refusing to build.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply power telemetry fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          old = '''String buildStatusJSON() {\n  String json = "{";\n  json += "\\"ip\\":\\"" + WiFi.localIP().toString() + "\\",";\n  json += "\\"wifi\\":" + String(WiFi.status() == WL_CONNECTED ? "true" : "false") + ",";\n  json += "\\"relays\\":[";'''
          new = '''String buildStatusJSON() {\n  String json = "{";\n  json += "\\"ip\\":\\"" + WiFi.localIP().toString() + "\\",";\n  json += "\\"wifi\\":" + String(WiFi.status() == WL_CONNECTED ? "true" : "false") + ",";\n  json += "\\"tariff\\":" + String(electricityTariff, 2) + ",";\n  json += "\\"relays\\":[";'''
          if old not in s:
              raise SystemExit('Expected buildStatusJSON header was not found; refusing to build.')
          s = s.replace(old, new, 1)

          old = '''    json += "\\"manualOverride\\":" + String(r.manualOverride ? "true" : "false") + ",";\n    json += "\\"runtime\\":" + String(getCurrentRuntime(i)) + ",";'''
          new = '''    json += "\\"manualOverride\\":" + String(r.manualOverride ? "true" : "false") + ",";\n    json += "\\"runtime\\":" + String(getCurrentRuntime(i)) + ",";\n    json += "\\"wattage\\":" + String(r.wattage, 2) + ",";'''
          if old not in s:
              raise SystemExit('Expected relay status block was not found; refusing to build.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate hardware-test source
        run: |
          if grep -nE '^<<<<<<<|^=======|^>>>>>>>' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino; then exit 1; fi
          grep -q '#include <ArduinoOTA.h>' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'struct ScheduleSlot {' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  19,$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  18,$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  5,$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  17$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryActive' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryRuntime' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryPower' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryEnergy' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryNext' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '"tariff"' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '"wattage"' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install required libraries
        run: |
          arduino-cli lib install "ArduinoJson"

      - name: Compile hardware-test firmware
        run: |
          rm -rf build
          mkdir -p build/firmware
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all --output-dir build/firmware /tmp/ESP32_Smart_Relay_Controller

      - name: Publish build summary
        run: |
          echo "## 8-channel Hardware Test Firmware" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: v2.0.1 release" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPIO: R1=19, R2=18, R3=5, R4=17" >> "$GITHUB_STEP_SUMMARY"
          echo "- Relay 5-8: unused" >> "$GITHUB_STEP_SUMMARY"
          echo "- OTA: ArduinoOTA included" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard summary cards: runtime, power, energy and next schedule enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Power telemetry: wattage and tariff included in /api/status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/firmware >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/firmware/* >> "$GITHUB_STEP_SUMMARY"

      - name: Package test files
        run: |
          mkdir -p artifact
          cp /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino artifact/ESP32_Smart_Relay_Controller_8ch_Test.ino
          cp build/firmware/*.bin artifact/
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Publish temporary test release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          TEST_TAG="v2.0.1-8ch-test"
          if gh release view "$TEST_TAG" >/dev/null 2>&1; then
            gh release delete "$TEST_TAG" --yes --cleanup-tag
          fi
          gh release create "$TEST_TAG" --target "$GITHUB_SHA" --prerelease --title "v2.0.1 8CH Hardware Test" --notes "Temporary hardware-test build. Based on v2.0.1 with GPIO mapping R1=19, R2=18, R3=5, R4=17 and dashboard summary/power telemetry fixes. Not an official release."
          gh release upload "$TEST_TAG" "$GITHUB_WORKSPACE"/artifact/* --clobber
