name: Prepare 8ch Hardware Test Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hardware-test-8ch-v2.0.1

permissions:
  contents: write

env:
  TEST_BRANCH: feature/hardware-test-8ch-v2.0.1

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "${GITHUB_REPOSITORY}" repo -- --branch "$TEST_BRANCH" --single-branch
          cd repo
          git fetch --depth 1 origin tag v2.0.1

      - name: Restore clean v2.0.1 source
        run: |
          cd repo
          rm -rf /tmp/ESP32_Smart_Relay_Controller
          mkdir -p /tmp/ESP32_Smart_Relay_Controller
          git show v2.0.1:firmware/v2.0.1/ESP32_Smart_Relay_Controller.ino > /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino

      - name: Apply 8-channel hardware GPIO mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          old = '''const uint8_t relayPins[RELAY_COUNT] = {\n  5,\n  17,\n  16,\n  4\n};'''
          new = '''const uint8_t relayPins[RELAY_COUNT] = {\n  19,\n  18,\n  5,\n  17\n};'''
          if old not in s:
              raise SystemExit('Expected v2.0.1 relay GPIO block was not found; refusing to build.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply dashboard summary fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          old = '''function render() {\n\n  if (!DATA) return;\n\n\n  $("connection").textContent ='''
          new = '''function render() {\n\n  if (!DATA) return;\n\n  // Update dashboard summary cards from the live relay status.\n  // Runtime values are milliseconds; wattage values are watts.\n  const activeRelays = DATA.relays.filter(r => r.state).length;\n  let totalRuntime = 0;\n  let currentPower = 0;\n  let totalEnergyWh = 0;\n\n  DATA.relays.forEach(relay => {\n    const runtime = Number(relay.runtime || 0);\n    const watts = Number(relay.wattage || 0);\n\n    totalRuntime += runtime;\n    if (relay.state) currentPower += watts;\n    totalEnergyWh += (runtime / 3600000) * watts;\n  });\n\n  $("summaryActive").textContent =\n    activeRelays + " / " + DATA.relays.length;\n\n  $("summaryActiveDetail").textContent =\n    activeRelays === 0\n      ? "All relays OFF"\n      : activeRelays + " relay" + (activeRelays === 1 ? "" : "s") + " ON";\n\n  $("summaryRuntime").textContent =\n    formatRuntime(totalRuntime);\n\n  $("summaryRuntimeDetail").textContent =\n    "Across all relays";\n\n  $("summaryPower").textContent =\n    currentPower.toFixed(1).replace(/\\.0$/, "") + " W";\n\n  $("summaryEnergy").textContent =\n    totalEnergyWh.toFixed(2) + " Wh today";\n\n  const nextSchedule = getNextSchedule();\n\n  if (nextSchedule) {\n    $("summaryNext").textContent =\n      nextSchedule.date.toLocaleTimeString([], {\n        hour: "2-digit",\n        minute: "2-digit",\n        hour12: true\n      });\n\n    $("summaryNextDetail").textContent =\n      nextSchedule.relay.name;\n  } else {\n    $("summaryNext").textContent = "None";\n    $("summaryNextDetail").textContent = "No upcoming schedule";\n  }\n\n\n  $("connection").textContent ='''
          if old not in s:
              raise SystemExit('Expected render() block was not found; refusing to build.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply power telemetry fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          old = '''String buildStatusJSON() {\n  String json = "{";\n  json += "\\"ip\\":\\"" + WiFi.localIP().toString() + "\\",";\n  json += "\\"wifi\\":" + String(WiFi.status() == WL_CONNECTED ? "true" : "false") + ",";\n  json += "\\"relays\\":[";'''
          new = '''String buildStatusJSON() {\n  String json = "{";\n  json += "\\"ip\\":\\"" + WiFi.localIP().toString() + "\\",";\n  json += "\\"wifi\\":" + String(WiFi.status() == WL_CONNECTED ? "true" : "false") + ",";\n  json += "\\"tariff\\":" + String(electricityTariff, 2) + ",";\n  json += "\\"relays\\":[";'''
          if old not in s:
              raise SystemExit('Expected buildStatusJSON header was not found; refusing to build.')
          s = s.replace(old, new, 1)

          old = '''    json += "\\"manualOverride\\":" + String(r.manualOverride ? "true" : "false") + ",";\n    json += "\\"runtime\\":" + String(getCurrentRuntime(i)) + ",";'''
          new = '''    json += "\\"manualOverride\\":" + String(r.manualOverride ? "true" : "false") + ",";\n    json += "\\"runtime\\":" + String(getCurrentRuntime(i)) + ",";\n    json += "\\"wattage\\":" + String(r.wattage, 2) + ",";'''
          if old not in s:
              raise SystemExit('Expected relay status block was not found; refusing to build.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply Wi-Fi recovery and dashboard error fixes
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')

          ssid = os.environ.get('WIFI_SSID', '')
          password = os.environ.get('WIFI_PASSWORD', '')
          if not ssid or not password:
              raise SystemExit('WIFI_SSID and WIFI_PASSWORD repository secrets are required for the hardware-test build.')

          # Inject credentials only into the generated firmware source. They are
          # never written to the repository source or workflow file.
          s, count = re.subn(
              r'const char\* DEFAULT_WIFI_SSID = "[^"]*";\nconst char\* DEFAULT_WIFI_PASSWORD = "[^"]*";',
              lambda m: 'const char* DEFAULT_WIFI_SSID = "' + ssid.replace('\\', '\\\\').replace('"', '\\"') + '";\n'
                        'const char* DEFAULT_WIFI_PASSWORD = "' + password.replace('\\', '\\\\').replace('"', '\\"') + '";',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit('Default Wi-Fi credential block was not found; refusing to build.')

          # If NVS contains an empty SSID/password, fall back to the compiled
          # defaults. This prevents a stale empty Preferences value from
          # overriding the valid hardware-test credentials.
          old = '''  wifiSSID = prefs.getString("ssid", DEFAULT_WIFI_SSID);\n  wifiPassword = prefs.getString("pass", DEFAULT_WIFI_PASSWORD);'''
          new = '''  wifiSSID = prefs.getString("ssid", "");\n  wifiPassword = prefs.getString("pass", "");\n  if (wifiSSID.length() == 0) wifiSSID = DEFAULT_WIFI_SSID;\n  if (wifiPassword.length() == 0) wifiPassword = DEFAULT_WIFI_PASSWORD;'''
          if old not in s:
              raise SystemExit('Wi-Fi Preferences load block was not found.')
          s = s.replace(old, new, 1)

          # Make initial connection retry longer and configure automatic STA reconnect.
          old = '''  WiFi.mode(WIFI_STA);\n\n  WiFi.begin(\n    wifiSSID.c_str(),\n    wifiPassword.c_str()\n  );'''
          new = '''  WiFi.mode(WIFI_STA);\n  WiFi.setAutoReconnect(true);\n  WiFi.persistent(false);\n\n  WiFi.begin(\n    wifiSSID.c_str(),\n    wifiPassword.c_str()\n  );'''
          if old not in s:
              raise SystemExit('Wi-Fi initialization block was not found.')
          s = s.replace(old, new, 1)

          # Add a periodic recovery loop without blocking normal web/relay work.
          marker = '// ============================================================\n// JSON STATUS'
          recovery = '''unsigned long lastWiFiReconnectAttempt = 0;\n\nvoid maintainWiFi() {\n  if (WiFi.status() == WL_CONNECTED) return;\n  if (wifiSSID.length() == 0) return;\n\n  unsigned long now = millis();\n  if (now - lastWiFiReconnectAttempt < 15000UL) return;\n  lastWiFiReconnectAttempt = now;\n\n  Serial.println("Wi-Fi disconnected - attempting reconnect...");\n  WiFi.disconnect(false, false);\n  delay(100);\n  WiFi.begin(wifiSSID.c_str(), wifiPassword.c_str());\n}\n\n'''
          if marker not in s:
              raise SystemExit('JSON STATUS marker was not found.')
          s = s.replace(marker, recovery + marker, 1)

          # The browser should distinguish transport failure from an API/UI exception.
          old = '''function loadStatus() {\n\n  fetch("/api/status")\n\n  .then(response => response.json())\n\n  .then(data => {\n\n    DATA = data;\n\n    render();\n\n  })\n\n  .catch(() => {\n\n    $("connection").textContent =\n      "Disconnected";\n\n    $("systemStatus").innerHTML =\n      "<span style='color:#f23845'>● ESP32 disconnected</span>";\n\n  });'''
          new = '''function loadStatus() {\n\n  fetch("/api/status", { cache: "no-store" })\n\n  .then(async response => {\n    const text = await response.text();\n    if (!response.ok) throw new Error(text || ("HTTP " + response.status));\n    try {\n      return JSON.parse(text);\n    } catch (e) {\n      throw new Error("Invalid status response from ESP32");\n    }\n  })\n\n  .then(data => {\n    DATA = data;\n    DATA.connected = true;\n    try {\n      render();\n      loadPowerSettings();\n    } catch (e) {\n      console.error("Dashboard render error:", e);\n    }\n  })\n\n  .catch(error => {\n    if (DATA) {\n      DATA.connected = false;\n      try { render(); } catch (e) {}\n    }\n    $("connection").textContent = "Disconnected";\n    $("systemStatus").innerHTML =\n      "<span style='color:#f23845'>● ESP32 disconnected</span>";\n    console.error("ESP32 status request failed:", error);\n  });'''
          if old not in s:
              raise SystemExit('loadStatus() block was not found.')
          s = s.replace(old, new, 1)

          # Use actual reachability for the UI status instead of transient Wi-Fi.status().
          s = s.replace('DATA.wifi\n      ? "Connected"\n      : "Disconnected";', 'DATA.connected\n      ? "Connected"\n      : "Disconnected";', 1)
          s = s.replace('(DATA.wifi ? "Connected" : "Disconnected")', '(DATA.connected ? "Connected" : "Disconnected")', 1)
          s = s.replace('$("systemStatus").innerHTML = DATA.wifi', '$("systemStatus").innerHTML = DATA.connected', 1)

          old = '''function savePowerSettings() {\n  let params = new URLSearchParams();\n\n  for (let i = 0; i < 4; i++) {\n    let input = $("wattage" + (i + 1));\n    let value = Number(input ? input.value : 0);\n    if (!Number.isFinite(value) || value < 0) value = 0;\n    params.append("watt" + (i + 1), value);\n  }\n\n  let tariff = Number($("tariff") ? $("tariff").value : 0);\n  if (!Number.isFinite(tariff) || tariff < 0) tariff = 0;\n  params.append("tariff", tariff);\n\n  fetch("/api/power", {\n    method: "POST",\n    headers: {\n      "Content-Type": "application/x-www-form-urlencoded"\n    },\n    body: params.toString()\n  })\n  .then(response => {\n    if (!response.ok) throw new Error("Power settings failed");\n    return response.json();\n  })\n  .then(data => {\n    DATA = data;\n    render();\n  })\n  .catch(() => {\n    $("systemStatus").innerHTML =\n      "<span style='color:#f23845'>● Failed to save power settings</span>";\n  });\n}'''
          new = '''function savePowerSettings() {\n  let params = new URLSearchParams();\n\n  for (let i = 0; i < 4; i++) {\n    let input = $("wattage" + (i + 1));\n    let value = Number(input ? input.value : 0);\n    if (!Number.isFinite(value) || value < 0) value = 0;\n    params.append("watt" + (i + 1), value);\n  }\n\n  let tariff = Number($("tariff") ? $("tariff").value : 0);\n  if (!Number.isFinite(tariff) || tariff < 0) tariff = 0;\n  params.append("tariff", tariff);\n\n  fetch("/api/power", {\n    method: "POST",\n    cache: "no-store",\n    headers: {\n      "Content-Type": "application/x-www-form-urlencoded"\n    },\n    body: params.toString()\n  })\n  .then(async response => {\n    const text = await response.text();\n    if (!response.ok) throw new Error(text || ("HTTP " + response.status));\n    try {\n      return JSON.parse(text);\n    } catch (e) {\n      throw new Error("ESP32 saved the request but returned an invalid JSON response");\n    }\n  })\n  .then(data => {\n    DATA = data;\n    DATA.connected = true;\n    try {\n      render();\n      loadPowerSettings();\n    } catch (e) {\n      console.error("Dashboard render error after power save:", e);\n    }\n    $("systemStatus").innerHTML =\n      "<span style='color:#08b95c'>● Power settings saved</span>";\n  })\n  .catch(error => {\n    $("systemStatus").innerHTML =\n      "<span style='color:#f23845'>● Power settings failed: " + escapeHtml(error.message || "Unknown error") + "</span>";\n    console.error("Power settings request failed:", error);\n  });\n}'''
          if old not in s:
              raise SystemExit('savePowerSettings() block was not found.')
          s = s.replace(old, new, 1)

          # Make Emergency OFF visually and functionally distinct from the normal buttons.
          old = '''.btn-schedule {\n\n  background:var(--card);\n\n  color:var(--text);\n\n  border:\n    1px solid\n    var(--border);\n}'''
          new = '''.btn-schedule {\n\n  background:var(--card);\n\n  color:var(--text);\n\n  border:\n    1px solid\n    var(--border);\n}\n\n.btn-emergency {\n  background:#fff5f5;\n  color:#d62828 !important;\n  border:1px solid #ff8a8a !important;\n}\n\n.btn-emergency:hover {\n  background:#ffe3e3;\n}\n\n.btn-emergency:disabled {\n  opacity:.55;\n  cursor:not-allowed;\n}'''
          if old not in s:
              raise SystemExit('Emergency button CSS anchor was not found.')
          s = s.replace(old, new, 1)

          old = '${relay.emergency ? `<button class="btn btn-off" onclick="resumeRelay(${relay.id})">▶ Resume AUTO</button>` : `<button class="btn" style="border:1px solid #ff8a8a" onclick="emergencyOff(${relay.id})">🚨 Emergency OFF</button>`}'
          new = '${relay.emergency ? `<button class="btn btn-off btn-emergency" onclick="resumeRelay(${relay.id})">▶ Resume AUTO</button>` : `<button class="btn btn-emergency" onclick="emergencyOff(${relay.id})">🚨 Emergency OFF</button>`}'
          if old not in s:
              raise SystemExit('Emergency button HTML was not found.')
          s = s.replace(old, new, 1)

          # Call recovery from the main loop.
          old = '''void loop() {\n  server.handleClient();\n  ArduinoOTA.handle();\n  processSchedules();\n  delay(2);\n}'''
          new = '''void loop() {\n  server.handleClient();\n  ArduinoOTA.handle();\n  maintainWiFi();\n  processSchedules();\n  delay(2);\n}'''
          if old not in s:
              raise SystemExit('loop() block was not found.')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate hardware-test source
        run: |
          if grep -nE '^<<<<<<<|^=======|^>>>>>>>' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino; then exit 1; fi
          grep -q '#include <ArduinoOTA.h>' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'struct ScheduleSlot {' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  19,$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  18,$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  5,$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '^  17$' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryActive' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryRuntime' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryPower' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryEnergy' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'summaryNext' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '"tariff"' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q '"wattage"' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'maintainWiFi' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'Power settings saved' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'btn-emergency' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install required libraries
        run: |
          arduino-cli lib install "ArduinoJson"

      - name: Compile hardware-test firmware
        run: |
          rm -rf build
          mkdir -p build/firmware
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all --output-dir build/firmware /tmp/ESP32_Smart_Relay_Controller

      - name: Publish build summary
        run: |
          echo "## 8-channel Hardware Test Firmware" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: v2.0.1 release" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPIO: R1=19, R2=18, R3=5, R4=17" >> "$GITHUB_STEP_SUMMARY"
          echo "- Relay 5-8: unused" >> "$GITHUB_STEP_SUMMARY"
          echo "- OTA: ArduinoOTA included" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard summary cards: runtime, power, energy and next schedule enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Power telemetry: wattage and tariff included in /api/status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Wi-Fi: automatic reconnect and compiled test credentials" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI: real API errors and Emergency OFF button styling" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/firmware >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/firmware/* >> "$GITHUB_STEP_SUMMARY"

      - name: Package test files
        run: |
          mkdir -p artifact
          cp /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino artifact/ESP32_Smart_Relay_Controller_8ch_Test.ino
          cp build/firmware/*.bin artifact/
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Publish temporary test release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          TEST_TAG="v2.0.1-8ch-test"
          if gh release view "$TEST_TAG" >/dev/null 2>&1; then
            gh release delete "$TEST_TAG" --yes --cleanup-tag
          fi
          gh release create "$TEST_TAG" --target "$GITHUB_SHA" --prerelease --title "v2.0.1 8CH Hardware Test" --notes "Temporary hardware-test build. Based on v2.0.1 with GPIO mapping R1=19, R2=18, R3=5, R4=17, Wi-Fi recovery, dashboard/API error handling and Emergency OFF UI fixes. Not an official release."
          gh release upload "$TEST_TAG" "$GITHUB_WORKSPACE"/artifact/* --clobber
