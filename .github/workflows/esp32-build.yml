name: ESP32 Firmware Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable-4ch
            path: firmware/v3.2.8
            version: 3.2.8
            gpio: "5,17,16,4"
            hardware: "4-relay stable baseline"
          - name: development-8ch
            path: firmware/v3.3.0
            version: 3.3.0
            gpio: "19,18,5,17,32,33,25,14"
            hardware: "8-relay development baseline"

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Prepare firmware
        run: |
          rm -rf /tmp/ESP32_Smart_Relay_Controller
          mkdir -p /tmp/ESP32_Smart_Relay_Controller
          test -f "${{ matrix.path }}/ESP32_Smart_Relay_Controller.ino"
          cp "${{ matrix.path }}/ESP32_Smart_Relay_Controller.ino" /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino

      - name: Validate source
        run: |
          FW=/tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino

          if grep -nE '^<<<<<<<|^=======|^>>>>>>>' "$FW"; then
            echo "Merge conflict markers found."
            exit 1
          fi

          grep -q '#define FW_VERSION "${{ matrix.version }}"' "$FW"
          grep -qE 'const uint8_t relayPins\[RELAY_COUNT\] = \{${{ matrix.gpio }}\};' "$FW"

          if grep -nE 'DEFAULT_WIFI_PASSWORD = "[^" ]+"|DEFAULT_WIFI_SSID = "[^" ]+"' "$FW"; then
            echo "Potential personal Wi-Fi credential found in source."
            exit 1
          fi

          echo "${{ matrix.version }} source validation passed."

      - name: Compile firmware
        run: |
          rm -rf build
          mkdir -p build/firmware
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            --output-dir build/firmware \
            /tmp/ESP32_Smart_Relay_Controller

      - name: Publish build summary
        run: |
          echo "## ESP32 Smart Relay Controller v${{ matrix.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firmware: **v${{ matrix.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Board: \`esp32:esp32:esp32\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPIO: **${{ matrix.gpio }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hardware status: **${{ matrix.hardware }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/firmware >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/firmware/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
