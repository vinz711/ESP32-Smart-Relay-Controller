name: ESP32 Firmware Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Prepare stable firmware
        run: |
          rm -rf /tmp/ESP32_Smart_Relay_Controller
          mkdir -p /tmp/ESP32_Smart_Relay_Controller
          test -f firmware/v3.2.8/ESP32_Smart_Relay_Controller.ino
          cp firmware/v3.2.8/ESP32_Smart_Relay_Controller.ino /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino

      - name: Validate source
        run: |
          if grep -nE '^<<<<<<<|^=======|^>>>>>>>' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino; then
            echo "Merge conflict markers found."
            exit 1
          fi
          grep -q '#define FW_VERSION "3.2.8"' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          grep -q 'const uint8_t relayPins\[RELAY_COUNT\] = {5, 17, 16, 4};' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino
          if grep -nE 'DEFAULT_WIFI_PASSWORD = "[^" ]+"|DEFAULT_WIFI_SSID = "[^" ]+"' /tmp/ESP32_Smart_Relay_Controller/ESP32_Smart_Relay_Controller.ino; then
            echo "Potential personal Wi-Fi credential found in source."
            exit 1
          fi
          echo "v3.2.8 source validation passed."

      - name: Compile firmware
        run: |
          rm -rf build
          mkdir -p build/firmware
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            --output-dir build/firmware \
            /tmp/ESP32_Smart_Relay_Controller

      - name: Publish build summary
        run: |
          echo "## ESP32 Smart Relay Controller v3.2.8" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firmware: **v3.2.8**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Board: \`esp32:esp32:esp32\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPIO: **R1=5, R2=17, R3=16, R4=4**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hardware status: **validated 4-relay baseline**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/firmware >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/firmware/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
