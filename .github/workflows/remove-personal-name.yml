name: Remove Personal Branding

on:
  push:
    branches:
      - remove-personal-name-v3.2.8
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Remove personal name from v3.2.8 firmware') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest branch
        run: |
          set -e
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=20 origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Remove personal name only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firmware/v3.2.8/ESP32_Smart_Relay_Controller.ino')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("VINAY'S AQUARIUM CONTROLLER - v3.2.8", "AQUARIUM CONTROLLER - v3.2.8")
          s2 = s2.replace("Serial.println(\"Vinay's Aquarium Controller v3.2.8\");", "Serial.println(\"Aquarium Controller v3.2.8\");")
          if s2 == s:
              print('Personal name already removed; nothing to commit.')
              raise SystemExit(0)
          p.write_text(s2, encoding='utf-8')
          PY
          git diff -- firmware/v3.2.8/ESP32_Smart_Relay_Controller.ino

      - name: Commit and push branding-only change
        run: |
          if git diff --quiet -- firmware/v3.2.8/ESP32_Smart_Relay_Controller.ino; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/v3.2.8/ESP32_Smart_Relay_Controller.ino
          git commit -m "Remove personal name from v3.2.8 firmware"
          git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
